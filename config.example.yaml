# Trading bot settings. Copy this file to "config.yaml" and edit that copy.
# You can tune the bot here without touching any code.

exchange: binance          # any exchange name ccxt supports (binance, bybit, okx, ...)
market: spot               # "spot" or "future" (USDT perpetual futures)
timeframe: 1h              # candle size: 15m, 30m, 1h, 2h or 4h

# Coins to trade. Keep to liquid coins whose Binance minimum order (about
# 5 USDT on spot) fits inside your per-trade budget.
symbols:
  - ETH/USDT
  - SOL/USDT
  - BNB/USDT
  - XRP/USDT

capital:
  starting_kes: 5000
  kes_per_usdt: 129        # update to today's rate; used to show results in KES

risk:
  risk_per_trade: 0.01     # lose at most 1% of the balance if a stop-loss is hit
  max_daily_loss: 0.03     # stop opening trades for the day after a 3% loss
  max_open_positions: 3    # the balance is split into this many slots
  futures_enabled: false   # futures stay OFF until you switch this on
  max_leverage: 2          # never use more than 2x on futures
  min_order_usdt: 5        # skip trades smaller than the exchange minimum

# Which strategy to run:
#   auto      - checks if each coin is trending or ranging and picks for you
#   ema_adx   - trend: moving-average crossover, only when the trend is strong
#   donchian  - trend: buy breakouts above the recent high
#   bb_rsi    - range: buy near the lower Bollinger Band when RSI is oversold
strategy: auto

strategy_params:
  ema_adx:  {fast: 20, slow: 50, adx_period: 14, adx_min: 25, atr_stop: 2.0}
  donchian: {entry_period: 20, exit_period: 10, atr_stop: 2.0}
  bb_rsi:   {bb_period: 20, bb_std: 2.0, rsi_period: 14, rsi_low: 30, rsi_high: 70, atr_stop: 1.5}
  auto:     {adx_period: 14, trend_above: 25, range_below: 20}

backtest:
  start: "2024-01-01"
  end: null                # null = up to today
  fee_rate: 0.001          # Binance spot taker fee 0.1% (futures is about 0.05%)
  slippage: 0.0005         # assume fills 0.05% worse than the candle price
